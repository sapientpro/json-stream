name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # `prepare` runs build + test
      - run: npm ci
      - run: node scripts/smoke.mjs
      - run: npx --yes @arethetypeswrong/cli --pack .
      - name: Smoke test the packed tarball
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer
          # run from the consumer, or ESM self-reference resolves back to this repo
          cp scripts/smoke.mjs /tmp/consumer/
          cd /tmp/consumer
          npm init -y > /dev/null
          npm install /tmp/sapientpro-json-stream-*.tgz
          node smoke.mjs @sapientpro/json-stream
          node -e "require('@sapientpro/json-stream');require('@sapientpro/json-stream/node')"

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: bunx jest
      - run: bun scripts/smoke.mjs

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
      - run: npm ci
      - run: deno run --allow-read scripts/smoke.mjs
